<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  color:#f7fbff;
  font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 12% 4%,#214ba8 0,transparent 28%),
    radial-gradient(circle at 88% 25%,#47258e 0,transparent 27%),
    linear-gradient(180deg,#061744,#031137);
}
.card{
  width:min(520px,100%);
  padding:34px 24px 30px;
  text-align:center;
  background:rgba(7,22,58,.72);
  border:1px solid rgba(150,185,255,.22);
  border-radius:28px;
  box-shadow:0 20px 55px rgba(0,0,0,.30);
  backdrop-filter:blur(10px);
}
.logo{
  display:block;
  width:min(430px,92%);
  height:auto;
  max-height:190px;
  object-fit:contain;
  margin:0 auto 30px;
}
.sub{
  margin:0 0 24px;
  color:#cbd8f5;
  font-size:14px;
}
.buttons{display:grid;gap:14px}
a{
  display:block;
  text-decoration:none;
  border-radius:16px;
  padding:17px 18px;
  font-weight:700;
  font-size:17px;
  border:1px solid rgba(255,255,255,.16);
  transition:transform .15s ease,opacity .15s ease;
}
a:active{transform:scale(.98);opacity:.9}
.host{
  color:#fff;
  background:linear-gradient(135deg,#3f7cff,#6650d9);
  box-shadow:0 8px 24px rgba(55,103,220,.25);
}
.guest{
  color:#f7fbff;
  background:rgba(255,255,255,.08);
}
.note{
  margin:22px 0 0;
  color:#91a5d0;
  font-size:12px;
  line-height:1.7;
}
</style>
